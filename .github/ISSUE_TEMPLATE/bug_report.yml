name: Report a problem
description: Help us reproduce a setup, profile or writing issue.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Keep private profiles, client details and confidential notes out of issues. Use a fictional or redacted example."
  - type: input
    id: environment
    attributes:
      label: Platform, model and RawVoice version
      placeholder: "ChatGPT Project / Claude skill / Claude Project guide; version 1.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Include a short fictional or redacted prompt and whether this was a fresh Project chat.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What did you expect, and what happened?
      description: Include the actual first response where relevant. Do not attach your complete private profile.
    validations:
      required: true
